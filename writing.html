<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Writing Archive · Cobb</title>
<meta name="description" content="Cobb 的 AI、产品与模型视觉文章归档。">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,[data-theme="warm"]{--bg:#FDFAF5;--text:#2C2C2C;--text2:#6B6B6B;--text3:#716B63;--accent:#C54229;--border:#E8E0D5;--border-strong:#d4c8b8;--display:'Bricolage Grotesque',sans-serif;--body:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;--ease:cubic-bezier(.16,1,.3,1)}
[data-theme="terminal"]{--bg:#0a0a0a;--text:#c0c0c0;--text2:#aaa;--text3:#888;--accent:#0f0;--border:#1a1a1a;--border-strong:#343a35;--display:'JetBrains Mono',monospace;--body:'JetBrains Mono',monospace;--mono:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:10;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
[data-theme="terminal"] body::before{display:none}
.wrap{width:min(1280px,calc(100% - 3rem));margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 0}
.brand{color:var(--text);font:800 1.35rem var(--display);letter-spacing:-.02em;text-decoration:none}.brand span{color:var(--accent)}
.nav-actions{display:flex;align-items:center;gap:1rem}.home-link{color:var(--text2);font-size:.85rem;text-decoration:none}.home-link:hover{color:var(--accent)}
.theme-switch{width:40px;height:40px;border:1px solid var(--border-strong);border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--text2);font-size:1rem;cursor:pointer}.theme-switch:hover{border-color:var(--accent);color:var(--accent)}
[data-theme="terminal"] .theme-switch{border-radius:0}
.archive-header{padding:4.25rem 0 2.75rem;border-bottom:1px solid var(--border);margin-bottom:3.5rem}
.eyebrow{margin-bottom:.7rem;color:var(--accent);font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
h1{max-width:14ch;font:800 clamp(2.75rem,6vw,5rem)/.94 var(--display);letter-spacing:-.05em}
.archive-source{margin-top:1rem;color:var(--accent);font-size:.82rem}
.writing-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4.5rem 2rem;padding-bottom:6rem}
.writing-card{min-width:0}
.writing-cover-link{display:block;overflow:hidden;border-radius:5px;background:#111;box-shadow:0 12px 28px rgba(49,38,24,.1);transition:transform .24s var(--ease),box-shadow .24s var(--ease)}
.writing-cover-link:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(49,38,24,.16)}
.writing-cover-link:focus-visible,.writing-title-link:focus-visible,.home-link:focus-visible,.theme-switch:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.writing-cover{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
.writing-meta{margin:.8rem 0 .28rem;color:var(--text3);font:400 .61rem/1.45 var(--mono);letter-spacing:.05em}
.writing-card-title{font:700 1rem/1.38 var(--display);letter-spacing:-.01em}
.writing-title-link{color:var(--text);text-decoration:none;text-underline-offset:3px}.writing-title-link:hover{color:var(--accent);text-decoration:underline}
.archive-empty{grid-column:1/-1;border:1px dashed var(--border);padding:3rem;text-align:center;color:var(--text3)}
[data-theme="terminal"] .writing-cover-link{border-radius:0;box-shadow:none}[data-theme="terminal"] .writing-cover-link:hover{transform:none}
@media(max-width:900px){.archive-header{padding-top:3.75rem}.writing-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.wrap{width:min(100% - 2.2rem,1280px)}.nav{padding:.9rem 0}.archive-header{padding:3rem 0 2.2rem;margin-bottom:2rem}.writing-grid{grid-template-columns:1fr;gap:3.5rem;padding-bottom:4rem}h1{font-size:clamp(2.5rem,14vw,4rem)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.writing-cover-link{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Archive navigation">
    <a class="brand" href="index.html">Cobb<span>.</span></a>
    <div class="nav-actions"><a class="home-link" href="index.html#writing">← Home</a><button class="theme-switch" id="themeSwitch" type="button" aria-label="Switch theme">☼</button></div>
  </nav>
  <main>
    <header class="archive-header">
      <p class="eyebrow">Writing archive</p>
      <h1>Writing &amp; Thoughts</h1>
      <p class="archive-source">Every article opens on Xiaohongshu ↗</p>
    </header>
    <section class="writing-grid" id="writingArchive" aria-label="All writing" aria-live="polite"><p class="archive-empty">Loading writing…</p></section>
  </main>
</div>
<script src="writing/writing-gallery.js"></script>
<script>
(function(){
  var root=document.documentElement;
  var toggle=document.getElementById("themeSwitch");
  function applyTheme(theme){root.setAttribute("data-theme",theme);toggle.textContent=theme==="warm"?"⌘":"☼";toggle.setAttribute("aria-label",theme==="warm"?"Switch to terminal theme":"Switch to warm theme")}
  try{applyTheme(localStorage.getItem("theme")||"warm")}catch(e){applyTheme("warm")}
  toggle.addEventListener("click",function(){var next=root.getAttribute("data-theme")==="warm"?"terminal":"warm";applyTheme(next);try{localStorage.setItem("theme",next)}catch(e){}});
  var archive=document.getElementById("writingArchive");
  fetch("writing/posts.json").then(function(response){return response.json()}).then(function(posts){posts.sort(function(a,b){return b.date.localeCompare(a.date)});WritingGallery.renderGallery(document,archive,posts,{sizes:"(max-width: 620px) calc(100vw - 2.2rem), (max-width: 900px) calc(50vw - 2.6rem), 400px",eagerCount:3})}).catch(function(){archive.innerHTML='<p class="archive-empty">Writing is temporarily unavailable.</p>'});
})();
</script>
</body>
</html>
